function legendOferta(){ return `<div class="legend"><span><i style="background:var(--prod)"></i>Producción propia</span><span><i style="background:var(--canje)"></i>Compra canje</span><span><i style="background:var(--pago)"></i>Compra con pago</span><span><i style="background:var(--venta)"></i>Venta</span></div>`; }
function chartOferta(id){
  const svg = document.getElementById(id); if(!svg) return; svg.innerHTML = "";
  const W=760,H=300,L=58,R=12,T=16,B=40;
  const max = Math.ceil(Math.max(...D.oferta.map(o=>Math.max(o.prod+terc(o),o.venta)))/40000)*40000;
  const sy = v => T+(H-T-B)*(1-v/max), mut=css("--muted"), line=css("--line"), ink=css("--ink");
  for(let v=0; v<=max; v+=40000){ svg.append(sv("line",{x1:L,x2:W-R,y1:sy(v),y2:sy(v),stroke:line})); svg.append(sv("text",{x:L-8,y:sy(v)+4,"text-anchor":"end","font-size":11,fill:mut,"font-family":"IBM Plex Mono,monospace"},fmt(v/1000)+" mil")); }
  const gw=(W-L-R)/D.oferta.length, bw=Math.min(56,gw*.32);
  D.oferta.forEach((o,i)=>{
    const x0=L+gw*i+gw/2-bw-4; let acc=0;
    [["prod","--prod"],["canje","--canje"],["pago","--pago"]].forEach(([k,c])=>{ const y1=sy(acc+o[k]),y0=sy(acc); svg.append(sv("rect",{x:x0,y:y1,width:bw,height:Math.max(0,y0-y1),fill:css(c),opacity:(k==="prod"&&o.prod_tipo!=="real")?.55:1})); acc+=o[k]; });
    svg.append(sv("text",{x:x0+bw/2,y:sy(acc)-5,"text-anchor":"middle","font-size":11,fill:ink,"font-family":"IBM Plex Mono,monospace"},fmt(acc/1000,1)));
    const xv=x0+bw+8; svg.append(sv("rect",{x:xv,y:sy(o.venta),width:bw,height:sy(0)-sy(o.venta),fill:css("--venta")}));
    svg.append(sv("text",{x:xv+bw/2,y:sy(o.venta)-5,"text-anchor":"middle","font-size":11,fill:ink,"font-family":"IBM Plex Mono,monospace"},fmt(o.venta/1000,1)));
    svg.append(sv("text",{x:L+gw*i+gw/2,y:H-17,"text-anchor":"middle","font-size":12.5,fill:ink},lab(o.c)));
    svg.append(sv("text",{x:L+gw*i+gw/2,y:H-3,"text-anchor":"middle","font-size":10.5,fill:mut},"oferta · venta"));
  });
}

  <p class="note">La comisión de canje arranca en 0 porque no está medida: cargá lo que gana la empresa por tonelada de canje. Venta total de la unidad = producción propia estimada (${fmt(B.prodPropia)} tn) + compra a terceros. Hay ${fmt(D.canje.clientes)} clientes con saldo de canje por ARS ${fmt(D.canje.saldo_ars/1e6)} millones (≈ USD ${fmt(D.canje.saldo_ars/(D.canje.tc||1)/1e6,1)} millones).</p>`,
first => {
  if(!first){ sync(false); return; }
  PR.forEach(p => document.getElementById("in-"+p.k).addEventListener("input", e => { V[p.k] = +e.target.value; cur=-1; sync(false); }));
  document.querySelectorAll(".scen button").forEach(b => b.addEventListener("click", () => { cur=+b.dataset.s; V=Object.assign({},S[cur],{com:V.com}); sync(true); }));
  sync(true);
});
function sync(set){
  PR.forEach(p => { if(set) document.getElementById("in-"+p.k).value = V[p.k]; document.getElementById("out-"+p.k).textContent = fmt(V[p.k],p.d||0)+p.u; });
  document.querySelectorAll(".scen button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.s===cur)));
  const r = calc(V), b0 = calc(Object.assign({},S[0],{com:V.com})), vs=(r.tn/B.tn25-1)*100;
  document.getElementById("sim-k").innerHTML = `<div class="kpi"><span>Compra a terceros</span><b class="num">${fmt(r.tn)} tn</b><span class="d">${sg(vs,0)} vs ${lab(c3)}</span></div>
    <div class="kpi"><span>Productores activos</span><b class="num">${fmt(r.prod)}</b><span class="d">${lab(c3)}: ${B.prodBase}</span></div>
    <div class="kpi"><span>Resultado de la compra</span><b class="num ${r.res>=0?'up':'dn'}">USD ${fmt(r.res/1000)} mil</b><span class="d">${fmt(r.porTn,1)} USD/tn</span></div>
    <div class="kpi"><span>Venta total de la unidad</span><b class="num">${fmt(B.prodPropia+r.tn)} tn</b><span class="d">con ${fmt(B.prodPropia)} tn propias</span></div>`;
  document.getElementById("sim-d").innerHTML = cur>=0 ? `<b>${S[cur].n}.</b> ${S[cur].t}` : `<b>Escenario propio.</b> Contra la inercia: ${sg(r.tn-b0.tn,0," tn")} y USD ${fmt((r.res-b0.res)/1000)} mil de diferencia.`;
  const svg=document.getElementById("ch-sc"); svg.innerHTML="";
  const rows=S.map((s,i)=>({n:s.c,r:calc(Object.assign({},s,{com:V.com})),on:i===cur})); if(cur<0) rows.push({n:"Propio",r,on:true});
  const W=540,L=150,R=80,rh=230/rows.length,mx=Math.max(110000,...rows.map(x=>x.r.tn)),ink=css("--ink"),mut=css("--muted");
  svg.append(sv("text",{x:L,y:12,"font-size":10.5,fill:mut,"font-family":"IBM Plex Mono,monospace"},"toneladas de terceros · resultado USD"));
  rows.forEach((x,i)=>{const y=20+i*rh,h=Math.min(22,rh-12),w=(W-L-R)*x.r.tn/mx;
    svg.append(sv("text",{x:L-8,y:y+h/2+4,"text-anchor":"end","font-size":12,fill:x.on?ink:mut,"font-weight":x.on?600:400},x.n));
    svg.append(sv("rect",{x:L,y,width:Math.max(2,w),height:h,rx:3,fill:x.on?css("--accent"):css("--line")}));
    svg.append(sv("text",{x:L+w+6,y:y+h/2-1,"font-size":11,fill:ink,"font-family":"IBM Plex Mono,monospace"},fmt(x.r.tn/1000,1)+" mil tn"));
    svg.append(sv("text",{x:L+w+6,y:y+h/2+12,"font-size":10.5,fill:x.r.res>=0?css("--good"):css("--bad"),"font-family":"IBM Plex Mono,monospace"},"USD "+fmt(x.r.res/1000)+" mil"));});
}

/* ================= navegación ================= */
const tabsEl = document.getElementById("tabs"), main = document.getElementById("main");
const panes = {};
TABS.forEach(t => {
  const b = document.createElement("button"); b.type = "button"; b.setAttribute("role","tab"); b.textContent = t.name; b.dataset.t = t.id; tabsEl.append(b);
  const p = document.createElement("section"); p.className = "pane"; p.id = "p-"+t.id; p.hidden = true; p.innerHTML = t.fn(); main.append(p);
  panes[t.id] = {b, p, after: t.after};
});
function show(id){
  if(!panes[id]) id = "resumen";
  Object.entries(panes).forEach(([k,o]) => { o.p.hidden = k !== id; o.b.setAttribute("aria-selected", String(k === id)); });
  const o = panes[id], first = !o.p.dataset.listo;
  o.p.dataset.listo = "1";
  if(o.after) o.after(first);
  try { history.replaceState(null, "", "#"+id); } catch(_){}
}
tabsEl.addEventListener("click", e => { const b = e.target.closest("button"); if(b){ show(b.dataset.t); window.scrollTo(0,0); } });
show((location.hash||"").slice(1) || "resumen");
const redraw = () => { const id = Object.keys(panes).find(k => !panes[k].p.hidden); if(id && panes[id].after) panes[id].after(false); };
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw); } catch(_){}
})();
</script>
